# Default values for user-service Helm chart.
# Override with values-local.yaml or values-production.yaml

replicaCount: 2

image:
  repository: ghcr.io/pawanITC/user-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Annotations added to every Pod (Prometheus scraping enabled by default)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: microservices.local
      paths:
        - path: /api/v1/users(/|$)(.*)
          pathType: ImplementationSpecific
        - path: /user-service/swagger-ui(/|$)(.*)
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Extra volumes (emptyDir required when readOnlyRootFilesystem=true)
extraVolumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

extraVolumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /app/logs

nodeSelector: {}

tolerations: []

# Prefer spreading pods across different nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["user-service"]
          topologyKey: kubernetes.io/hostname

# Spread pods across availability zones
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: user-service

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  failureThreshold: 30
  periodSeconds: 10

# Environment variables injected as ConfigMap
configMap:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  LOGGING_LEVEL_COM_EXAMPLE_USERSERVICE: "INFO"
  SPRING_JPA_SHOW_SQL: "false"

# Database configuration — credentials sourced from a Kubernetes Secret
database:
  host: postgres-user-service
  port: "5432"
  name: userdb
  # Name of an existing Secret containing DB_USERNAME and DB_PASSWORD keys
  existingSecret: user-service-secret
  usernameKey: DB_USERNAME
  passwordKey: DB_PASSWORD

# PodDisruptionBudget — ensures at least N pods are always available during upgrades
pdb:
  enabled: true
  minAvailable: 1

# NetworkPolicy — restrict inbound/outbound traffic to only what is needed
networkPolicy:
  enabled: true

# Prometheus ServiceMonitor (requires Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: 30s
  path: /actuator/prometheus
  namespace: monitoring

# Graceful shutdown: wait up to 60 s for in-flight requests to complete
terminationGracePeriodSeconds: 60
