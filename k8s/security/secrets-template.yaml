# ============================================================
# SECRETS MANAGEMENT — READ BEFORE USING
# ============================================================
#
# NEVER commit real secrets to git.
# This file is a TEMPLATE only — showing the structure needed.
#
# RECOMMENDED APPROACHES FOR PRODUCTION:
#
# Option A: External Secrets Operator (sync from AWS/GCP/Azure/Vault)
#   1. Install: helm install external-secrets external-secrets/external-secrets -n external-secrets-system
#   2. Create a SecretStore pointing to your secrets backend
#   3. Create ExternalSecret resources (see examples below)
#
# Option B: Sealed Secrets (encrypt secrets in git)
#   1. Install: helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#   2. kubeseal --fetch-cert > pub-cert.pem
#   3. kubectl create secret generic user-service-secret --dry-run=client -o yaml | kubeseal --cert pub-cert.pem -o yaml > user-service-sealedsecret.yaml
#   4. Commit the SealedSecret YAML (safe to commit — encrypted)
#
# ============================================================

