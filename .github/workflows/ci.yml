name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ── Test user-service ─────────────────────────────────────────────────────
  test-user-service:
    name: Test user-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -pl services/user-service --no-transfer-progress

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-test-report
          path: services/user-service/target/surefire-reports/

  # ── Test order-service ────────────────────────────────────────────────────
  test-order-service:
    name: Test order-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -pl services/order-service --no-transfer-progress

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-service-test-report
          path: services/order-service/target/surefire-reports/

  # ── Lint Helm charts ──────────────────────────────────────────────────────
  helm-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'
      - run: helm lint helm/user-service
      - run: helm lint helm/order-service

  # ── Validate K8s manifests ────────────────────────────────────────────────
  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate local overlay
        run: kustomize build k8s/overlays/local > /dev/null

      - name: Validate production overlay
        run: kustomize build k8s/overlays/production > /dev/null

  # ── Build and push user-service image ─────────────────────────────────────
  build-user-service:
    name: Build & Push user-service
    needs: [test-user-service, helm-lint, validate-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/user-service
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: services/user-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build and push order-service image ────────────────────────────────────
  build-order-service:
    name: Build & Push order-service
    needs: [test-order-service, helm-lint, validate-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/order-service
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/order-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Trivy vulnerability scan ──────────────────────────────────────────────
  security-scan:
    name: Vulnerability Scan
    needs: [build-user-service, build-order-service]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan user-service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/user-service:latest
          format: sarif
          output: trivy-user-service.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan order-service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/order-service:latest
          format: sarif
          output: trivy-order-service.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-user-service.sarif

      - name: Upload order-service scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-order-service.sarif
